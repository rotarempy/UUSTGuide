    <path stroke-width="4" d="M280 103 H331 M356 103 H430 M260 103 V145 M260 173 V195 M450 103 V145 M450 173 V195"/>
    <path stroke-width="6" d="M20 195 H351 M379 195 H821 M850 195 H1019 M1048 195 H1180"/>

    <!-- Центральный коридор и южный ряд комнат -->
