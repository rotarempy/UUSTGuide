<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720">
  <title>План перехода между четвёртым и пятым этажами — упрощённая векторная схема</title>
  <desc>Контур, стены, проёмы и лестничные клетки по фотографии. Белый цвет является заливкой контура; за его пределами SVG прозрачен. Геометрия приблизительная.</desc>
  <!-- Внешняя форма этажа: белая заливка принадлежит самому контуру. -->
  <path d="M20 20 H1285 V174 Q1285 196 1263 196 H1210 V300 H1263 Q1285 300 1285 322 V500 H470 V690 H20 Z"
        fill="#fff" stroke="#181818" stroke-width="7" stroke-linejoin="round"/>

