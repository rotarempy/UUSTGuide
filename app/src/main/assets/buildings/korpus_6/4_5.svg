    <path stroke-width="4.5" d="M320 300 V500 M420 300 V500 M545 300 V500 M775 300 V500 M980 300 V500 M1180 300 V500"/>
    <!-- Кабинет у левого края открывается в коридор -->
    <path stroke-width="4" d="M260 195 V228 M260 263 V300"/>
    <!-- Нижняя левая лестница и проход к ней -->
    <path stroke-width="5" d="M20 500 H320 M420 500 H470 M320 500 V690"/>
    <path stroke-width="3.5" d="M98 554 H242 V634 H98 Z"/>
    <path stroke-width="2.4" d="M38 526 H295 M38 655 H295"/>
    <path stroke-width="2" d="M45 526 V555 M57 526 V555 M69 526 V555 M81 526 V555 M93 526 V555 M105 526 V555 M117 526 V547 M129 526 V547 M141 526 V547 M153 526 V547 M165 526 V547 M177 526 V547 M189 526 V547 M201 526 V547 M213 526 V547 M225 526 V547 M237 526 V555 M249 526 V555 M261 526 V555 M273 526 V555 M285 526 V555 M45 634 V655 M57 634 V655 M69 634 V655 M81 634 V655 M93 641 V655 M105 641 V655 M117 641 V655 M129 641 V655 M141 641 V655 M153 641 V655 M165 641 V655 M177 641 V655 M189 641 V655 M201 641 V655 M213 641 V655 M225 641 V655 M237 634 V655 M249 634 V655 M261 634 V655 M273 634 V655 M285 634 V655"/>

    <!-- Правая верхняя лестница -->
    <path stroke-width="4" d="M1180 20 V84 M1180 165 V196 M1210 196 H1263"/>
    <path stroke-width="2.3" d="M1193 47 H1271 M1193 59 H1271 M1193 71 H1271 M1193 83 H1271 M1193 95 H1271 M1193 107 H1271 M1193 119 H1271 M1193 131 H1271 M1193 143 H1271 M1193 155 H1271 M1193 167 H1271"/>
    <!-- Правая нижняя лестница -->
    <path stroke-width="4" d="M1180 300 H1202 M1233 300 H1263"/>
    <path stroke-width="2.3" d="M1193 334 H1271 M1193 346 H1271 M1193 358 H1271 M1193 370 H1271 M1193 382 H1271 M1193 394 H1271 M1193 406 H1271 M1193 418 H1271 M1193 430 H1271 M1193 442 H1271 M1193 454 H1271 M1193 466 H1271"/>
