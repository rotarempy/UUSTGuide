<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="390" viewBox="0 0 1450 390">
  <title>План четвёртого этажа — упрощённая векторная схема</title>
  <desc>Контур, перегородки, дверные проёмы и лестницы. Белая заливка принадлежит контуру этажа; снаружи прозрачность. Схема приблизительная, не для навигации при эвакуации.</desc>
  <!-- Сам контур здания: это единственная белая заливка в документе. -->
  <path d="M20 20 H1410 V360 H20 Z" fill="#fff" stroke="#171717" stroke-width="7" stroke-linejoin="miter"/>

  <g fill="none" stroke="#171717" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Два больших помещения слева и выходы из них -->
    <path stroke-width="5" d="M20 185 H315 M315 20 V125 M315 160 V185 M315 185 V220 M315 255 V360"/>
    <!-- Пространство перед первой лестницей -->
    <path stroke-width="5" d="M445 20 V160 M445 225 V241 M445 360 V344"/>

    <!-- Северные помещения: разрывы в стене обозначают двери -->
    <path stroke-width="6" d="M445 160 H592 M618 160 H667 M689 160 H895 M923 160 H1124 M1152 160 H1215 M1241 160 H1320 M1346 160 H1410"/>
    <path stroke-width="4.5" d="M640 20 V160 M708 20 V160 M946 20 V160 M1182 20 V160 M1295 20 V160"/>

    <!-- Южные помещения: коридор и дверные проёмы -->
    <path stroke-width="6" d="M445 225 H474 M502 225 H575 M575 225 H602 M628 225 H672 M698 225 H758 M786 225 H970 M999 225 H1110 M1138 225 H1218 M1246 225 H1410"/>
    <path stroke-width="4.5" d="M575 225 V360 M710 225 V360 M912 225 V360 M1073 225 V360 M1188 225 V360"/>

    <!-- Техническая комната и санузел у левой лестницы -->
    <path stroke-width="3.5" d="M575 264 H710 M642 264 V328 M642 338 V360"/>
    <!-- Небольшой тамбур перед правой лестницей -->
    <path stroke-width="3.5" d="M1073 267 H1188"/>

    <!-- Левая лестница: две группы ступеней и промежуточная площадка -->
    <path stroke-width="2.5" d="M459 243 H559 M459 290 H559 M459 302 H559 M459 346 H559"/>
    <path stroke-width="2" d="M465 243 V290 M476 243 V290 M487 243 V290 M498 243 V290 M509 243 V290 M520 243 V290 M531 243 V290 M542 243 V290 M553 243 V290 M465 302 V346 M476 302 V346 M487 302 V346 M498 302 V346 M509 302 V346 M520 302 V346 M531 302 V346 M542 302 V346 M553 302 V346"/>
    <!-- Правая лестница -->
    <path stroke-width="2.5" d="M1087 278 H1174 M1087 315 H1174 M1087 324 H1174 M1087 348 H1174"/>
    <path stroke-width="2" d="M1094 278 V315 M1104 278 V315 M1114 278 V315 M1124 278 V315 M1134 278 V315 M1144 278 V315 M1154 278 V315 M1164 278 V315 M1094 324 V348 M1104 324 V348 M1114 324 V348 M1124 324 V348 M1134 324 V348 M1144 324 V348 M1154 324 V348 M1164 324 V348"/>
  </g>
</svg>
